<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Vattal Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        /* ===== Toast Notifications ===== */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            z-index: 9999;
            animation: slideInRight 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            font-weight: 500;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .toast-success { 
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-left: 4px solid #b45309;
        }
        .toast-error { 
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-left: 4px solid #b91c1c;
        }
        .toast-info { 
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-left: 4px solid #1d4ed8;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(120%) scale(0.8); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        /* ===== Login Container ===== */
        .login-container {
            background: rgba(45, 45, 45, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(245, 158, 11, 0.1);
            animation: fadeInUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 1px solid rgba(245, 158, 11, 0.1);
        }
        
        @keyframes fadeInUp {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== Floating Particles Background ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #18191b 0%, #2d2d2d 50%, #18191b 100%);
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.05);
            animation: float 20s infinite ease-in-out;
        }
        
        .particle:nth-child(1) { width: 300px; height: 300px; top: -100px; right: -100px; animation-delay: 0s; }
        .particle:nth-child(2) { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-delay: -5s; }
        .particle:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -10s; }
        .particle:nth-child(4) { width: 100px; height: 100px; top: 20%; right: 10%; animation-delay: -3s; }
        .particle:nth-child(5) { width: 80px; height: 80px; bottom: 20%; right: 20%; animation-delay: -7s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.1); }
            50% { transform: translate(-20px, 30px) scale(0.9); }
            75% { transform: translate(20px, 20px) scale(1.05); }
        }

        /* ===== Input Fields ===== */
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #3d3d3d;
            background: #18191b;
            color: #e5e7eb;
        }
        
        .input-field:focus {
            border-color: #f59e0b;
            background: #1a1a1a;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
            transform: translateY(-1px);
        }
        
        .input-field:hover {
            border-color: #f59e0b;
            background: #1a1a1a;
        }
        
        .input-field::placeholder {
            color: #6b7280;
        }

        /* ===== Login Button ===== */
        .login-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            background-size: 200% 200%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: white;
            font-weight: 600;
            padding: 0.875rem;
            border-radius: 0.75rem;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .login-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.35);
        }
        
        .login-btn:active {
            transform: translateY(0px);
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }
        
        .login-btn:hover::before {
            left: 100%;
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Logo Animation ===== */
        .logo-icon {
            animation: pulseLogo 3s infinite ease-in-out;
        }
        
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(-2deg); }
        }

        /* ===== Error Message ===== */
        .error-box {
            animation: shake 0.5s ease;
            display: none;
        }
        
        .error-box.show {
            display: flex;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ===== Back Link ===== */
        .back-link {
            position: relative;
            transition: all 0.3s ease;
            color: #9ca3af;
            text-decoration: none;
        }
        
        .back-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            transition: width 0.3s ease;
        }
        
        .back-link:hover::after {
            width: 100%;
        }
        
        .back-link:hover {
            color: #f59e0b;
        }

        /* ===== Login Loading ===== */
        #loginLoading {
            display: none;
            text-align: center;
            padding: 0.75rem 0;
        }
        
        #loginLoading .spinner {
            border: 3px solid #3d3d3d;
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem !important;
                margin: 1rem;
            }
            .toast {
                top: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== Background Particles ===== -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== Login Container ===== -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="login-container rounded-2xl max-w-md w-full p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="logo-icon relative inline-block">
                    <a href="index.html" class="flex items-center justify-center space-x-3 group">
                        <img src="assets/images/vattal-logo.png" 
                             alt="Vattal Studios" 
                             class="h-20 w-auto object-contain brightness-0 invert group-hover:scale-105 transition-transform duration-300" />
                    </a>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight mt-4">Welcome Back</h2>
                <p class="text-gray-400 text-sm mt-1">Sign in to manage your cinema projects</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">
                        <i class="fas fa-envelope mr-2 text-amber-500"></i> Email Address
                    </label>
                    <input type="email" id="email" required 
                        class="input-field w-full px-4 py-3 rounded-xl focus:outline-none transition"
                        placeholder="admin@example.com" value="admin@example.com" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">
                        <i class="fas fa-lock mr-2 text-amber-500"></i> Password
                    </label>
                    <input type="password" id="password" required 
                        class="input-field w-full px-4 py-3 rounded-xl focus:outline-none transition"
                        placeholder="Enter your password" value="admin123" />
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 text-amber-500 rounded border-gray-600 bg-[#18191b] focus:ring-amber-500" />
                        <label for="remember" class="ml-2 text-sm text-gray-400">Remember me</label>
                    </div>
                    <a href="#" class="text-sm text-amber-500 hover:text-amber-400 transition">Forgot password?</a>
                </div>

                <!-- Error Message -->
                <div id="loginError" class="error-box bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm items-start gap-3">
                    <i class="fas fa-exclamation-circle text-red-500 mt-0.5"></i>
                    <span id="errorMsg">Invalid credentials</span>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="login-btn flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Loading State -->
                <div id="loginLoading">
                    <div class="spinner"></div>
                    <p class="text-gray-500 text-sm mt-2">Authenticating...</p>
                </div>

                <!-- Demo Credentials -->
                <!--<div class="mt-4 p-3 bg-[#18191b] rounded-xl border border-gray-700">
                    <p class="text-xs text-gray-500 text-center">
                        <i class="fas fa-info-circle mr-1 text-amber-500"></i>
                        Demo: admin@example.com / admin123
                    </p>
                </div>-->
            </form>

            <!-- Back Link -->
            <!--<div class="mt-6 text-center">
                <a href="index.html" class="back-link text-sm inline-flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>-->
        </div>
    </div>

    <!-- Footer Credit -->
    <div class="fixed bottom-4 left-0 right-0 text-center z-10">
        <p class="text-xs text-gray-500/50">© 2026 Vattal Studios. All rights reserved.</p>
    </div>

    <script>
        window.API_URL = 'http://localhost:8000/api/v1';
    </script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
