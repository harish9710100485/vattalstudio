# backend/render.yaml
services:
  - type: web
    name: vattal-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vattal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ADMIN_EMAIL
        value: admin@vattalstudios.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://vattal-studio.vercel.app,https://vattalstudio.vercel.app,https://*.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: postgresql
    name: vattal-db
    plan: free
    databaseName: enquiry_db
    user: enquiry_user